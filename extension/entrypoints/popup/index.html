<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAYDSS</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <header>
      <h1>YAYDSS</h1>
      <span id="state" class="pill">…</span>
    </header>

    <div id="access" class="problem access" hidden>
      <span>YAYDSS can't reach YouTube / Discord yet (site access is off).</span>
      <button id="grant" type="button" class="primary">Allow access</button>
    </div>

    <section class="video">
      <div id="title" class="title">Loading…</div>
      <div id="author" class="muted"></div>
      <div id="start" class="muted"></div>
      <ul id="notes" class="notes"></ul>
    </section>

    <p id="problem" class="problem" hidden></p>

    <fieldset id="settings">
      <label for="channel">Discord channel</label>
      <input id="channel" type="url" placeholder="Paste link: right-click channel → Copy Link" />
      <div class="row">
        <button id="use-tab" type="button" class="secondary">Use current Discord tab</button>
        <span id="channel-label" class="muted ellipsis"></span>
      </div>

      <label for="offset">Offset <span class="muted">(+ shows later chat)</span></label>
      <div class="row offset" id="offset-row">
        <button type="button" data-delta="-5000">−5</button>
        <button type="button" data-delta="-1000">−1</button>
        <input id="offset" type="number" step="1" value="0" />
        <span>s</span>
        <button type="button" data-delta="1000">+1</button>
        <button type="button" data-delta="5000">+5</button>
      </div>

      <label class="check">
        <input id="auto" type="checkbox" />
        <span id="auto-label">Auto-follow</span>
      </label>
    </fieldset>

    <section class="connection">
      <label for="send-to">Send to</label>
      <select id="send-to">
        <option value="tab">Discord in a browser tab (reloads the tab)</option>
        <option value="vencord">Discord desktop app (YAYDSS Vencord plugin)</option>
      </select>
      <div id="vencord-box" class="vencord" hidden>
        <div class="row">
          <input id="v-port" type="number" min="1024" max="65535" title="Port (same as in the plugin settings)" />
          <input id="v-token" type="password" placeholder="Pairing token from Discord" autocomplete="off" />
        </div>
        <div class="row">
          <button id="v-test" type="button" class="secondary">Test connection</button>
          <span id="v-result" class="muted ellipsis"></span>
        </div>
      </div>
    </section>

    <div class="row actions">
      <button id="sync" type="button" class="primary">Sync now</button>
      <button id="stop" type="button" class="secondary">Stop</button>
    </div>
    <p id="message" class="message" aria-live="polite"></p>

    <footer>
      <div>Discord time: <strong id="target">–</strong></div>
      <div class="muted">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></div>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
